name: Reset Sentinel

on:
  # Every 30 minutes, deliberately away from the top of the hour.
  # GitHub documents that scheduled runs can be delayed around :00.
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      test_webhook:
        description: 'Send a Discord test message only'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: reset-sentinel
  cancel-in-progress: false

jobs:
  check-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify parser tests
        run: python3 -m unittest discover -s tests -v

      - name: Send test notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_webhook }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 reset_tracker.py --test-webhook

      - name: Check Codex reset
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_webhook != true }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MAX_AGE_MINUTES: '10'
        run: python3 reset_tracker.py

      - name: Persist notified reset timestamp
        if: ${{ success() }}
        shell: bash
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state change to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: record notified Codex reset"
          git push

